name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Shared memory and page protection are platform-specific: all three must run the tests.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm, windows-11-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --all-features --no-fail-fast

  test-musl:
    name: test (linux ${{ matrix.arch }} musl)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo test --all-features --no-fail-fast --target ${{ matrix.target }}

  # 32-bit x86 (usize is 32 bits): the 32-bit binary runs on the 64-bit host kernel.
  test-i686:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: windows-latest, target: i686-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: 32-bit C runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-multilib
      - run: cargo test --all-features --no-fail-fast --target ${{ matrix.target }}

  # Unsupported target floor (DESIGN): the scanner builds everywhere, and `Region` is a compile error, never a
  # silent no-op, on a target without unix or windows page protection.
  unsupported-target:
    name: unsupported target (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --all-features
      - name: Region is a compile error here (negative control)
        run: |
          set -u
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<TOML
          [package]
          name = "probe"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          dirty-ranges = { path = "$GITHUB_WORKSPACE" }
          TOML
          echo 'pub fn f() { let _ = dirty_ranges::Region::arm; }' > "$probe/src/lib.rs"
          if out=$(cd "$probe" && cargo check --target wasm32-unknown-unknown 2>&1); then echo "$out"; echo "Region compiled on wasm32"; exit 1; fi
          echo "$out"
          echo "$out" | grep -q 'Region'

  # The tests map files under `std::env::temp_dir()`, which follows `TMPDIR`: run the whole suite with the mapped
  # files on tmpfs (`/dev/shm`) instead of the runner's disk. `conformance_tmpfs` checks the file system type.
  test-tmpfs:
    name: test (tmpfs mapping)
    runs-on: ubuntu-latest
    env:
      TMPDIR: /dev/shm
      DIRTY_RANGES_EXPECT_TMPFS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: df -T /dev/shm
      - run: cargo test --all-features --no-fail-fast -- --nocapture

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Read the floor from the manifest so the job cannot drift from it.
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: |
          rustc --version
          cargo check --all-targets --all-features

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  conformance:
    name: conformance controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Compiles the test hooks that make the crate misbehave on purpose, so every conformance case can show
      # it fails when the property it checks is broken. Never set for a release build.
      RUSTFLAGS: --cfg dirty_ranges_conformance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --test conformance --test conformance_children --test conformance_alloc -- --nocapture

  miri:
    name: miri (safe modules)
    runs-on: ubuntu-latest
    env:
      # The proptest case writes failure files and reads its settings from the environment, which Miri's
      # isolation forbids; fewer cases because Miri is slow. The nightly is pinned so a new nightly cannot turn
      # this red on its own.
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "true"
      PROPTEST_CASES: "24"
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-env-forward=PROPTEST_CASES -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: nightly-2026-09-29
          components: miri
      # Only the safe modules: `region` and `sys` call mprotect/VirtualProtect and install fault handlers, which
      # Miri cannot run (see "UNVERIFIED-by-Miri" in docs/DESIGN.md). The filter also guards against running none.
      - run: "cargo miri test --lib -- diff:: range:: scan:: page_state::"

  loom:
    name: loom (page-state machine)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      # Loom explores every interleaving; the filter makes sure the loom tests (not the ordinary ones) ran.
      - run: cargo test --release loom_ -- --nocapture

  # Advisory (CireSnave 2026-10-23): not a required check; findings are tracked as ROADMAP rows.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@ee9c3950c510fae136d316fed3bd9ecda343cede # 0.9.24
