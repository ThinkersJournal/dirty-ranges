[package]
name = "dirty-ranges"
version = "0.0.5"
edition = "2024"
rust-version = "1.94"
description = "Detect which byte ranges of a memory region changed between snapshots (name reserved; first release pending)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/dirty-ranges"
readme = "README.md"
keywords = ["memory", "diff", "shared-memory", "change-detection"]
categories = ["memory-management"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.12"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
